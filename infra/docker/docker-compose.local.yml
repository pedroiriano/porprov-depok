services:
  admin-web:
    build:
      args:
        # INFO: Port diagnostik Admin lokal harus memakai endpoint host lokal.
        # Konfigurasi base/VPS tetap memakai origin HTTPS canonical melalui edge.
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_OIDC_AUTHORITY: http://localhost:8080/realms/porprov
        # CHANGE: Foundation Cuba aktif lokal; set false untuk rollback Techwind.
        VITE_ADMIN_CUBA_PHASE_1: "true"
    volumes:
      - ./local/admin.nginx.conf:/etc/nginx/conf.d/default.conf:ro
