worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    variables_hash_bucket_size 128;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    limit_req_zone $binary_remote_addr zone=porprov_api:10m rate=30r/s;
    # SECURITY: Upload publik tetap dilindungi rate limit, tetapi memakai zona
    # terpisah agar pemuatan galeri tidak menghabiskan kuota request API.
    limit_req_zone $binary_remote_addr zone=porprov_uploads:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=porprov_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=porprov_analytics:10m rate=10r/s;
    limit_req_status 429;

    # SECURITY: Respons gagal tidak boleh tersimpan di cache browser/proxy.
    # Hanya file sukses dan validasi 304 yang mendapat cache publik satu hari.
    map $upstream_status $porprov_upload_cache_control {
        ~^(?:2\d\d|304)$ "public, max-age=86400";
        default "no-store";
    }
    # SECURITY: Setiap fallback mendefinisikan directive CSP yang tidak
    # mewarisi default-src (base-uri, form-action, dan frame-ancestors).
    map $uri $porprov_fallback_content_security_policy {
        ~^/(?:api|uploads)(?:/|$) "default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'none'; sandbox";
        ~^/admin(?:/|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; frame-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests";
        ~^/(?:realms|resources)(?:/|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'";
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self'; upgrade-insecure-requests";
    }

    # SECURITY: CSP nonce Next.js dan CSP Keycloak tetap dipertahankan. Admin,
    # API, serta upload selalu memakai kebijakan edge yang deterministik.
    map $uri $porprov_trust_upstream_content_security_policy {
        ~^/(?:admin|api|uploads|realms|resources)(?:/|$) 0;
        default 1;
    }

    # SECURITY: Upstream Public hanya dipercaya bila ketiga directive tanpa
    # fallback tersedia. Regresi source otomatis jatuh ke CSP edge lengkap.
    map $upstream_http_content_security_policy $porprov_upstream_content_security_policy_complete {
        "~*base-uri\s+[^;]+;.*frame-ancestors\s+[^;]+;.*form-action\s+" 1;
        default 0;
    }

    map "$porprov_trust_upstream_content_security_policy|$porprov_upstream_content_security_policy_complete|$upstream_http_content_security_policy" $porprov_content_security_policy {
        ~^1\|1\|.+$ $upstream_http_content_security_policy;
        default $porprov_fallback_content_security_policy;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream public_web {
        server public-web:3000;
    }

    upstream admin_web {
        server admin-web:80;
    }

    upstream api_gateway {
        server api-gateway:8000;
    }

    upstream keycloak_server {
        server keycloak:8080;
    }

    upstream umami_server {
        server umami:3000;
    }
    # SECURITY: VPS publik hanya menerima HTTP sebagai pintu redirect menuju
    # origin HTTPS canonical. Public, Admin, API, dan OIDC tidak dilayani
    # sebagai aplikasi melalui cleartext.
    server {
        listen 80;
        server_name porprov.depok.go.id;

        # SECURITY: Redirect cleartext tetap memiliki CSP deny-all yang lengkap
        # agar base-uri, form-action, dan frame-ancestors tidak pernah terbuka.
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'none'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 308 https://porprov.depok.go.id$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name porprov.depok.go.id;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PORPROV_TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/security_headers.conf;

        location = /admin {
            return 308 /admin/;
        }

        # Trailing slash pada proxy_pass menghapus prefix /admin/ sehingga
        # Nginx statis di container Admin tetap melayani file dari root.
        location ^~ /admin/ {
            proxy_pass http://admin_web/;
            include /etc/nginx/proxy_params;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security_headers.conf;
        }

        location ^~ /api/ {
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            limit_req zone=porprov_api burst=60 nodelay;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security_headers.conf;
        }

        location ^~ /uploads/ {
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params;
            limit_req zone=porprov_uploads burst=300 nodelay;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $porprov_upload_cache_control always;
            include /etc/nginx/security_headers.conf;
        }


        # SECURITY: Hanya tracker dan endpoint koleksi yang dibuka. Dashboard,
        # login, dan API statistik Umami tetap berada di jaringan internal.
        location = /analytics/porprov-insight.js {
            proxy_pass http://umami_server/porprov-insight.js;
            include /etc/nginx/proxy_params;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=3600" always;
            include /etc/nginx/security_headers.conf;
        }

        location = /analytics/api/collect {
            limit_except POST { deny all; }
            if ($http_origin !~* ^(https://porprov\.depok\.go\.id)$) {
                return 403;
            }
            proxy_pass http://umami_server/api/collect;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-For $remote_addr;
            limit_req zone=porprov_analytics burst=30 nodelay;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin "https://porprov.depok.go.id" always;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security_headers.conf;
        }

        location ^~ /analytics/ {
            return 404;
        }

        # Endpoint browser Keycloak yang dibutuhkan Authorization Code + PKCE.
        location /realms/ {
            proxy_pass http://keycloak_server;
            include /etc/nginx/proxy_params;
            limit_req zone=porprov_auth burst=20 nodelay;
        }

        location /resources/ {
            proxy_pass http://keycloak_server;
            include /etc/nginx/proxy_params;
        }

        location = /livescore {
            proxy_pass http://public_web;
            include /etc/nginx/proxy_params;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security_headers.conf;
        }

        location / {
            proxy_pass http://public_web;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
