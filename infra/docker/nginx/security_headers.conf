# SECURITY: Include ini dipakai di level server dan di setiap location yang
# mendefinisikan add_header sendiri, karena aturan inheritance Nginx akan
# mengganti seluruh header parent ketika satu add_header muncul di location.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# SECURITY: Edge mengeluarkan tepat satu CSP. Header upstream disimpan melalui
# $upstream_http_content_security_policy, disembunyikan oleh proxy_params, lalu
# dinormalisasi oleh map di nginx.conf/nginx.vps.conf.
add_header Content-Security-Policy $porprov_content_security_policy always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header X-Permitted-Cross-Domain-Policies none always;
