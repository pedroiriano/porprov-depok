{
  "openapi": "3.1.0",
  "info": {
    "title": "PORPROV Admin Enterprise API",
    "version": "12.0.0",
    "description": "Kontrak Admin Enterprise untuk otorisasi, akun, peran, notifikasi, taksonomi Panduan Kota, audit, media, dan tabel operasional."
  },
  "servers": [{ "url": "/api/v1" }],
  "security": [{ "bearerAuth": [] }],
  "paths": {
    "/drafts": {
      "get": {
        "summary": "Membaca draf milik pengguna aktif",
        "parameters": [
          { "$ref": "#/components/parameters/Route" },
          { "$ref": "#/components/parameters/Entity" },
          { "$ref": "#/components/parameters/FormVersion" }
        ],
        "responses": {
          "200": { "description": "Draf ditemukan", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/FormDraft" } } } },
          "204": { "description": "Draf tidak ditemukan" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      "put": {
        "summary": "Menyimpan draf dengan versi optimistis",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SaveDraft" } } } },
        "responses": {
          "200": { "description": "Draf tersimpan", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/FormDraft" } } } },
          "409": { "description": "Draf berubah di perangkat lain" },
          "422": { "description": "Draf tidak aman atau tidak valid" }
        }
      },
      "delete": {
        "summary": "Menghapus draf milik pengguna aktif",
        "parameters": [
          { "$ref": "#/components/parameters/Route" },
          { "$ref": "#/components/parameters/Entity" },
          { "$ref": "#/components/parameters/FormVersion" }
        ],
        "responses": { "204": { "description": "Draf tidak ada lagi" } }
      }
    },
    "/integrations/health": {
      "get": {
        "summary": "Membaca kesehatan integrasi tanpa target internal",
        "responses": {
          "200": { "description": "Hasil pemeriksaan", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IntegrationHealth" } } } },
          "403": { "description": "Peran tidak diizinkan" }
        }
      }
    },
    "/master-data/media": {
      "get": {
        "summary": "Membaca Pustaka Media beserta turunan gambar",
        "responses": { "200": { "description": "Daftar media" }, "403": { "description": "Peran tidak diizinkan" } }
      }
    },
    "/authorization/session": {
      "get": {
        "summary": "Membaca profil, peran, dan hak akses sesi aktif",
        "responses": { "200": { "description": "Konteks otorisasi" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/users": {
      "get": {
        "summary": "Membaca akun secara berhalaman berdasarkan status",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "status", "in": "query", "schema": { "type": "string", "enum": ["active", "inactive", "archived", "all"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "403": { "description": "Hak akses tidak mencukupi" } }
      }
    },
    "/users/{id}/status": {
      "put": {
        "summary": "Mengaktifkan atau menonaktifkan akun tanpa mengarsipkannya",
        "parameters": [{ "$ref": "#/components/parameters/Id" }],
        "responses": { "200": { "description": "Status akun diperbarui" }, "409": { "description": "Perubahan melanggar perlindungan akun" } }
      }
    },
    "/users/{id}/restore": {
      "post": {
        "summary": "Memulihkan akun yang diarsipkan",
        "parameters": [{ "$ref": "#/components/parameters/Id" }],
        "responses": { "200": { "description": "Akun dipulihkan" }, "403": { "description": "Hak akses tidak mencukupi" } }
      }
    },
    "/access-roles": {
      "get": {
        "summary": "Membaca peran secara berhalaman",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" } }
      },
      "post": { "summary": "Membuat peran khusus", "responses": { "201": { "description": "Peran dibuat" } } }
    },
    "/access-roles/permissions": {
      "get": { "summary": "Membaca katalog hak akses", "responses": { "200": { "description": "Daftar hak akses" } } }
    },
    "/notifications": {
      "get": {
        "summary": "Membaca notifikasi milik penerima aktif",
        "responses": { "200": { "description": "Daftar notifikasi terbaru milik penerima" } }
      }
    },
    "/notifications/{id}/read": {
      "put": {
        "summary": "Menandai satu notifikasi milik penerima sebagai telah dibaca",
        "parameters": [{ "$ref": "#/components/parameters/Id" }],
        "responses": { "204": { "description": "Notifikasi ditandai telah dibaca" }, "404": { "description": "Notifikasi tidak ditemukan untuk penerima" } }
      }
    },
    "/notifications/read-all": {
      "put": { "summary": "Menandai seluruh notifikasi penerima sebagai telah dibaca", "responses": { "204": { "description": "Seluruh notifikasi ditandai telah dibaca" } } }
    },
    "/master-data/city-guide-categories": {
      "get": { "summary": "Membaca kategori Panduan Kota aktif", "responses": { "200": { "description": "Daftar kategori aktif" } } }
    },
    "/master-data/city-guide-categories/manage": {
      "get": {
        "summary": "Membaca seluruh kategori Panduan Kota untuk pengelolaan",
        "parameters": [{ "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" }, { "$ref": "#/components/parameters/Query" }],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" } }
      },
      "post": { "summary": "Membuat kategori Panduan Kota", "responses": { "201": { "description": "Kategori dibuat" } } }
    },
    "/master-data/city-guides/manage": {
      "get": {
        "summary": "Membaca Panduan Kota untuk pengelolaan termasuk kategori tidak aktif",
        "parameters": [{ "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" }, { "$ref": "#/components/parameters/Query" }],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" } }
      }
    },
    "/user-directory/lookup": {
      "post": {
        "summary": "Mencari identitas aktor audit secara terbatas",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["actor_ids"], "properties": { "actor_ids": { "type": "array", "minItems": 1, "maxItems": 100, "items": { "type": "string", "maxLength": 255 } } } } } } },
        "responses": { "200": { "description": "Peta identitas aktor" }, "403": { "description": "Hanya layanan tepercaya" } }
      }
    },
    "/master-data/cabors": {
      "get": {
        "summary": "Membaca cabang olahraga untuk tabel Admin",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["name", "kategori", "total_medali", "technical_delegate", "status"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "400": { "$ref": "#/components/responses/InvalidListQuery" } }
      }
    },
    "/master-data/kontingens": {
      "get": {
        "summary": "Membaca kontingen untuk tabel Admin",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["name", "region_type"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "400": { "$ref": "#/components/responses/InvalidListQuery" } }
      }
    },
    "/master-data/nomor-tandings": {
      "get": {
        "summary": "Membaca nomor pertandingan untuk tabel Admin",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["name", "gender_category", "match_type"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "400": { "$ref": "#/components/responses/InvalidListQuery" } }
      }
    },
    "/venues": {
      "get": {
        "summary": "Membaca lokasi pertandingan untuk tabel Admin",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["name", "address", "capacity", "readiness_status"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "400": { "$ref": "#/components/responses/InvalidListQuery" } }
      }
    },
    "/schedule/matches/enriched": {
      "get": {
        "summary": "Membaca jadwal beserta peserta untuk tabel Admin",
        "parameters": [
          { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/PerPage" },
          { "$ref": "#/components/parameters/Query" }, { "$ref": "#/components/parameters/Direction" },
          { "name": "sort", "in": "query", "schema": { "type": "string", "enum": ["match_date", "nomor_tanding", "venue", "round", "status"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/PaginatedList" }, "400": { "$ref": "#/components/responses/InvalidListQuery" } }
      }
    }
  },
  "components": {
    "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" } },
    "parameters": {
      "Route": { "name": "route", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 255 } },
      "Entity": { "name": "entity", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 255 } },
      "FormVersion": { "name": "form_version", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 80 } },
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "PerPage": { "name": "per_page", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 10 } },
      "Query": { "name": "q", "in": "query", "schema": { "type": "string", "maxLength": 80 } },
      "Direction": { "name": "direction", "in": "query", "schema": { "type": "string", "enum": ["asc", "desc"], "default": "asc" } },
      "Id": { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
    },
    "responses": {
      "Unauthorized": { "description": "Autentikasi diperlukan" },
      "InvalidListQuery": { "description": "Parameter pencarian, pagination, atau pengurutan tidak valid" },
      "PaginatedList": {
        "description": "Daftar berhalaman. Permintaan kompatibilitas tanpa parameter pagination dapat tetap menghasilkan array pada endpoint lama.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PaginatedRecords" } } }
      }
    },
    "schemas": {
      "FormDraft": {
        "type": "object",
        "required": ["id", "route_key", "entity_key", "form_version", "payload", "version", "updated_at", "expires_at"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "route_key": { "type": "string" },
          "entity_key": { "type": "string" },
          "form_version": { "type": "string" },
          "payload": { "type": "object", "additionalProperties": true },
          "version": { "type": "integer", "minimum": 1 },
          "updated_at": { "type": "string", "format": "date-time" },
          "expires_at": { "type": "string", "format": "date-time" }
        }
      },
      "SaveDraft": {
        "type": "object",
        "required": ["route_key", "entity_key", "form_version", "payload", "expected_version"],
        "properties": {
          "route_key": { "type": "string", "maxLength": 255 },
          "entity_key": { "type": "string", "maxLength": 255 },
          "form_version": { "type": "string", "maxLength": 80 },
          "payload": { "type": "object", "additionalProperties": true },
          "expected_version": { "type": "integer", "minimum": 0 }
        }
      },
      "IntegrationStatus": {
        "type": "object",
        "required": ["key", "available", "latency_ms"],
        "properties": {
          "key": { "type": "string" },
          "available": { "type": "boolean" },
          "latency_ms": { "type": "integer", "minimum": 0 },
          "pending_items": { "type": "integer", "minimum": 0 },
          "retry_count": { "type": "integer", "minimum": 0 },
          "oldest_pending_seconds": { "type": "number", "minimum": 0 }
        },
        "additionalProperties": false
      },
      "IntegrationHealth": {
        "type": "object",
        "required": ["checked_at", "integrations"],
        "properties": {
          "checked_at": { "type": "string", "format": "date-time" },
          "integrations": { "type": "array", "items": { "$ref": "#/components/schemas/IntegrationStatus" } }
        }
      },
      "PaginatedRecords": {
        "type": "object",
        "required": ["data", "total", "page", "per_page", "total_pages"],
        "properties": {
          "data": { "type": "array", "items": { "type": "object", "additionalProperties": true } },
          "total": { "type": "integer", "minimum": 0 },
          "page": { "type": "integer", "minimum": 1 },
          "per_page": { "type": "integer", "minimum": 1, "maximum": 100 },
          "total_pages": { "type": "integer", "minimum": 1 }
        },
        "additionalProperties": false
      }
    }
  }
}
