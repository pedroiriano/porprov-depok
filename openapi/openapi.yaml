  "components": {
    "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" } },
    "parameters": {
      "Route": { "name": "route", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 255 } },
      "Entity": { "name": "entity", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 255 } },
      "FormVersion": { "name": "form_version", "in": "query", "required": true, "schema": { "type": "string", "maxLength": 80 } },
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "PerPage": { "name": "per_page", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 10 } },
      "Query": { "name": "q", "in": "query", "schema": { "type": "string", "maxLength": 80 } },
      "Direction": { "name": "direction", "in": "query", "schema": { "type": "string", "enum": ["asc", "desc"], "default": "asc" } },
      "Id": { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "MatchId": { "name": "matchID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "SubmissionId": { "name": "submissionID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ,"EntityPath": { "name": "entity", "in": "path", "required": true, "schema": { "type": "string", "enum": ["cabor", "nomor-tanding", "kontingen", "city-guide", "hero"] } }
    },
    "responses": {
      "Unauthorized": { "description": "Autentikasi diperlukan" },
      "InvalidListQuery": { "description": "Parameter pencarian, pagination, atau pengurutan tidak valid" },
      "PaginatedList": {
        "description": "Daftar berhalaman. Permintaan kompatibilitas tanpa parameter pagination dapat tetap menghasilkan array pada endpoint lama.",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PaginatedRecords" } } }
      }
    },
    "schemas": {
      "PortalFeature": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "module_id",
          "label",
          "public_enabled",
          "admin_enabled"
        ],
        "properties": {
          "id": {
            "type": "string",
            "enum": [
              "schedule_periods",
              "schedule_matches"
            ]
          },
          "module_id": {
            "const": "jadwal"
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "public_enabled": {
            "type": "boolean"
          },
          "admin_enabled": {
            "type": "boolean"
          }
        }
      },
      "PortalSection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "type",
          "enabled",
          "variant"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "description": "Jenis native milik halaman atau text/cta/image. Jadwal memiliki schedule_periods dan schedule_matches; urutan array menentukan tampilan."
          },
          "enabled": {
            "type": "boolean"
          },
          "variant": {
            "enum": [
              "standard",
              "compact"
            ]
          },
          "heading": {
