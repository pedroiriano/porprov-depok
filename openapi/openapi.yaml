          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "starts_on",
                "ends_on",
                "cabor_name",
                "label",
                "is_published"
              ],
              "default": "starts_on"
            }
          },
          {
            "$ref": "#/components/parameters/Direction"
          },
          {
            "name": "archived",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Daftar rentang sesuai filter Admin",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SchedulePeriodManagedPage"
                }
              }
            }
          },
          "400": {
            "description": "Payload, UUID, atau query tidak valid"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "description": "Izin atau modul tidak tersedia"
          },
          "409": {
            "description": "Versi berubah, status arsip berubah atau duplikat aktif"
          },
          "422": {
            "description": "Validasi rentang, referensi atau alasan gagal"
          },
          "503": {
            "description": "Dependency belum tersedia; detail internal disanitasi"
          }
        }
      }
    },
