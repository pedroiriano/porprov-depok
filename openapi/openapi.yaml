        "summary": "Membaca profil akun yang sedang aktif",
        "responses": { "200": { "description": "Profil akun" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/master-data/heroes/active": {
      "get": {
        "summary": "Membaca Hero aktif untuk Beranda publik",
        "security": [],
        "responses": { "200": { "description": "Hero aktif" }, "404": { "description": "Hero aktif belum tersedia" } }
      }
    },
    "/master-data/heroes": {
      "get": { "summary": "Membaca daftar Hero untuk Admin", "responses": { "200": { "description": "Daftar Hero" } } },
      "post": { "summary": "Membuat Hero", "responses": { "201": { "description": "Hero dibuat" }, "422": { "description": "Data Hero tidak valid" } } }
    },
    "/master-data/heroes/{id}": {
      "get": { "summary": "Membaca detail Hero", "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "200": { "description": "Detail Hero" }, "404": { "description": "Hero tidak ditemukan" } } },
      "put": { "summary": "Memperbarui Hero dengan riwayat perubahan", "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "200": { "description": "Hero diperbarui" }, "409": { "description": "Versi data telah berubah" } } },
      "delete": { "summary": "Mengarsipkan Hero", "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "204": { "description": "Hero diarsipkan" } } }
    },
    "/master-data/city-guides": {
      "get": { "summary": "Membaca Panduan Kota aktif untuk publik", "security": [], "responses": { "200": { "description": "Daftar Panduan Kota aktif" } } },
      "post": { "summary": "Membuat Panduan Kota", "responses": { "201": { "description": "Panduan Kota dibuat" } } }
    },
    "/master-data/city-guides/{id}": {
      "get": { "summary": "Membaca detail Panduan Kota", "security": [], "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "200": { "description": "Detail Panduan Kota" }, "404": { "description": "Data tidak ditemukan" } } },
      "put": { "summary": "Memperbarui Panduan Kota", "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "200": { "description": "Panduan Kota diperbarui" } } },
      "delete": { "summary": "Mengarsipkan Panduan Kota", "parameters": [{ "$ref": "#/components/parameters/Id" }], "responses": { "204": { "description": "Panduan Kota diarsipkan" } } }
