{
  "openapi": "3.1.0",
  "info": {
    "title": "PORPROV Web Platform API",
    "version": "14.0.0",
    "description": "Kontrak Web Platform untuk projection publik serta operasi Admin melalui API Gateway, termasuk otorisasi, akun, Master Data, jadwal, LiveScore, medali, audit, media, dan notifikasi."
  },
  "servers": [{ "url": "/api/v1" }],
  "security": [{ "bearerAuth": [] }],
  "paths": {
    "/portal/public": {
      "get": {
        "summary": "Projection konfigurasi Portal yang telah dipublikasikan",
        "description": "Adapter read-only menambahkan dua fitur Jadwal pada konfigurasi lama. Draf dan bagian tersembunyi tidak diterbitkan; versi dan JSON tersimpan tetap utuh.",
        "security": [],
        "responses": {
          "200": {
            "description": "Konfigurasi tayang",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PortalDocument"
                }
              }
            }
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      }
    },
    "/portal/manage": {
      "get": {
        "summary": "Draf dan publikasi Portal",
        "description": "Hanya Super Admin aktif dengan izin terbaru role.update.",
        "responses": {
          "200": {
            "description": "State Portal",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PortalState"
                }
              }
            }
          },
          "401": {
            "description": "JWT tidak tersedia/tidak valid"
          },
          "403": {
            "description": "Modul/fitur tidak aktif atau izin tidak cukup"
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      },
      "put": {
        "summary": "Simpan draf Portal berversi",
        "description": "Hanya Super Admin aktif dengan role.update. Fitur yang tidak dikirim klien lama dipertahankan dari draf yang dikunci; penyimpanan tidak mempublikasikan perubahan.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PortalChange"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Draf tersimpan",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PortalState"
                }
              }
            }
          },
          "401": {
            "description": "JWT tidak tersedia/tidak valid"
          },
          "403": {
            "description": "Modul/fitur tidak aktif atau izin tidak cukup"
          },
          "409": {
            "description": "Versi konflik"
          },
          "422": {
            "description": "Registry, bagian, atau referensi media tidak valid"
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      }
    },
    "/portal/publish": {
      "post": {
        "summary": "Publikasikan draf tersimpan secara atomik",
        "description": "Super Admin aktif dengan role.update; menyimpan revisi immutable dan audit outbox. Modul induk dan flag fitur berlaku kumulatif pada UI, Gateway, serta mutasi service.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PortalVersionChange"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "State dipublikasikan",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PortalState"
                }
              }
            }
          },
          "401": {
            "description": "JWT tidak tersedia/tidak valid"
          },
          "403": {
            "description": "Modul/fitur tidak aktif atau izin tidak cukup"
          },
          "409": {
            "description": "Versi konflik"
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      }
    },
    "/portal/references/livescore-matches": {
      "get": {
        "summary": "Referensi pertandingan baca-saja untuk operator skor",
        "description": "JWT + izin terbaru livescore.view dan modul LiveScore Admin aktif. Tetap terpisah dari kewenangan penyuntingan Jadwal; tidak menyediakan mutasi.",
        "responses": {
          "200": {
            "description": "Projection pertandingan diperkaya",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "description": "Projection yang sama dengan GET /schedule/matches/enriched; bentuk koleksi mengikuti parameter pagination existing."
                  }
                }
              }
            }
          },
          "401": {
            "description": "JWT tidak tersedia/tidak valid"
          },
          "403": {
            "description": "Modul/fitur tidak aktif atau izin tidak cukup"
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      }
    },
    "/livescore/schedule-projection": {
      "get": {
        "summary": "Projection jadwal baca-saja untuk LiveScore Public",
        "description": "Hanya saat modul LiveScore Public lokal aktif; fitur penyuntingan/publikasi Rincian Pertandingan tidak menjadi prasyarat. Tidak ada endpoint tulis.",
        "security": [],
        "responses": {
          "200": {
            "description": "Projection pertandingan diperkaya",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "description": "Projection yang sama dengan GET /schedule/matches/enriched; bentuk koleksi mengikuti parameter pagination existing."
                  }
                }
              }
            }
          },
          "403": {
            "description": "Modul/fitur tidak aktif atau izin tidak cukup"
          },
          "503": {
            "description": "Dependency tidak tersedia"
          }
        }
      }
    },
    "/schedule/periods": {
      "get": {
        "summary": "Membaca rentang pelaksanaan cabor yang tayang",
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "name": "per_page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 12
            }
          },
          {
            "$ref": "#/components/parameters/Query"
          },
          {
            "name": "cabor_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "date",
            "in": "query",
            "description": "Hari inklusif dalam rentang; tahun 2000–2100",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "starts_on",
                "ends_on",
                "cabor_name",
                "label",
                "is_published"
              ],
              "default": "starts_on"
            }
          },
          {
            "$ref": "#/components/parameters/Direction"
          }
        ],
        "responses": {
          "200": {
            "description": "Rentang tayang nonarsip; tanpa draf, versi atau identitas operator",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SchedulePeriodPublicPage"
                }
              }
            }
          },
          "400": {
            "description": "Payload, UUID, atau query tidak valid"
          },
          "403": {
            "description": "Izin atau modul tidak tersedia"
          },
          "503": {
            "description": "Dependency belum tersedia; detail internal disanitasi"
          }
        }
      },
      "post": {
        "summary": "Membuat rentang jadwal; versi awal 0, default draf",
        "x-permission": "master_data.create",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SchedulePeriodChange"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "State dan versi terbaru; snapshot/outbox tersimpan atomik",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SchedulePeriodManaged"
                }
              }
            }
          },
          "400": {
            "description": "Payload, UUID, atau query tidak valid"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "description": "Izin atau modul tidak tersedia"
          },
          "409": {
            "description": "Versi berubah, status arsip berubah atau duplikat aktif"
          },
          "422": {
            "description": "Validasi rentang, referensi atau alasan gagal"
          },
          "503": {
            "description": "Dependency belum tersedia; detail internal disanitasi"
          }
        }
      }
    },
    "/schedule/periods/manage": {
      "get": {
        "summary": "Membaca rentang aktif/draf/arsip untuk Admin",
        "x-permission": "master_data.view",
